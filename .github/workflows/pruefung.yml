# Prueft bei jedem Push und jedem Pull Request, was das README zusichert:
# die Anwendung baut, der Skriptkatalog ist konsistent und die Skripte sind
# unter Windows PowerShell 5.1 lauffaehig.
name: Pruefung

on:
  push:
    branches: [main, oberflaechentest-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  anwendung:
    name: Anwendung bauen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Wiederherstellen
        run: dotnet restore AdminWerk.sln

      - name: Bauen
        # Warnungen gelten als Fehler: der Stand ist warnungsfrei, das soll so bleiben.
        run: dotnet build AdminWerk.sln --configuration Release --no-restore -warnaserror

  skriptkatalog:
    name: Skriptkatalog pruefen
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Katalog, Syntax und 5.1-Tauglichkeit
        # Bewusst Windows PowerShell 5.1 (nicht pwsh): nur dieser Parser ist der
        # Massstab, auf den der Katalog zielt.
        shell: powershell
        run: .\tools\katalog-pruefen.ps1

      - name: PSScriptAnalyzer einrichten
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Import-Module PSScriptAnalyzer

          # Auch die Werkzeuge selbst: neue Skripte sollen nicht ungeprueft bleiben.
          # -Path nimmt nur einen Pfad, deshalb zwei Durchlaeufe.
          $befunde = @()
          foreach ($pfad in '.\src\AdminWerk\Scripts', '.\tools') {
              $befunde += Invoke-ScriptAnalyzer -Path $pfad -Recurse `
                  -Settings .\tools\PSScriptAnalyzerSettings.psd1
          }

          if (-not $befunde) {
              Write-Host 'Keine Befunde.' -ForegroundColor Green
              exit 0
          }

          foreach ($b in $befunde) {
              $datei = Resolve-Path -Relative $b.ScriptPath
              # Im Annotationsformat von GitHub, damit die Stelle im Diff markiert wird.
              $art = if ($b.Severity -eq 'Error') { 'error' } else { 'warning' }
              Write-Host ("::{0} file={1},line={2}::{3}: {4}" -f `
                  $art, $datei, $b.Line, $b.RuleName, $b.Message)
          }
          Write-Host ("{0} Befund(e)." -f $befunde.Count)
          exit 1

  # Versuch: laeuft die UI-Automation auf einem GitHub-Runner? Der Auftrag darf
  # scheitern, ohne den Rest rot zu faerben - er soll erst einmal nur Auskunft geben.
  oberflaeche:
    name: Oberflaechentests (Versuch)
    runs-on: windows-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Bauen
        run: dotnet build AdminWerk.sln --configuration Debug

      - name: Sitzung beschreiben
        shell: powershell
        run: |
          $ich = [System.Diagnostics.Process]::GetCurrentProcess()
          Write-Host ("UserInteractive : {0}" -f [Environment]::UserInteractive)
          Write-Host ("SessionId       : {0}" -f $ich.SessionId)
          Write-Host ("Benutzer        : {0}" -f [Environment]::UserName)
          Write-Host ("Fenstertitel    : '{0}'" -f $Host.UI.RawUI.WindowTitle)
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host ("Bildschirme     : {0}" -f [System.Windows.Forms.Screen]::AllScreens.Count)
          Write-Host ("Aufloesung      : {0}" -f [System.Windows.Forms.SystemInformation]::PrimaryMonitorSize)

      - name: Oeffnet die Anwendung ueberhaupt ein Fenster?
        shell: powershell
        run: |
          $exe = '.\src\AdminWerk\bin\Debug\net8.0-windows\AdminWerk.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $p = Get-Process -Id $p.Id -ErrorAction SilentlyContinue

          if (-not $p) {
              Write-Host 'Der Prozess hat sich sofort beendet.'
              exit 1
          }

          Write-Host ("Prozess laeuft      : {0}" -f (-not $p.HasExited))
          Write-Host ("MainWindowHandle    : {0}" -f $p.MainWindowHandle)
          Write-Host ("Fenstertitel        : '{0}'" -f $p.MainWindowTitle)

          if ($p.MainWindowHandle -eq 0) {
              Write-Host 'Kein Fenster - UI-Automation ist hier nicht moeglich.'
              Stop-Process -Id $p.Id -Force
              exit 1
          }

          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $wurzel = [System.Windows.Automation.AutomationElement]::FromHandle($p.MainWindowHandle)
          $bedingung = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
              [System.Windows.Automation.ControlType]::ListItem)
          $eintraege = @($wurzel.FindAll([System.Windows.Automation.TreeScope]::Descendants, $bedingung))
          Write-Host ("Elemente im Baum    : {0}" -f $eintraege.Count)
          Write-Host ("Erste Namen         : {0}" -f (($eintraege | Select-Object -First 6 |
              ForEach-Object { $_.Current.Name }) -join ' | '))

          Stop-Process -Id $p.Id -Force

      - name: Oberflaechentest
        shell: powershell
        run: .\tools\oberflaechentest.ps1

      - name: Alle Skripte durchgehen
        shell: powershell
        run: .\tools\alle-skripte-durchgehen.ps1
